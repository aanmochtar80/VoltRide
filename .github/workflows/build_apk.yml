name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure Android Support
        run: |
          rm -rf android
          echo "Running flutter create..."
          flutter create . --platforms android > create_log.txt 2>&1 || true
          cat create_log.txt
          
          if [ -d "android/app" ]; then
            echo "Android folder created successfully."
            sed -i 's/compileSdkVersion.*/compileSdkVersion 34/g' android/app/build.gradle || true
            sed -i 's/compileSdk .*/compileSdk 34/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion.*/minSdkVersion 21/g' android/app/build.gradle || true
            sed -i 's/minSdk .*/minSdk 21/g' android/app/build.gradle || true
            if [ -f android/build.gradle ]; then
              sed -i "s/ext.kotlin_version = '.+'/ext.kotlin_version = '1.9.22'/g" android/build.gradle || true
            fi
            if [ -f android/settings.gradle ]; then
              sed -i 's/id "org.jetbrains.kotlin.android" version ".*" apply false/id "org.jetbrains.kotlin.android" version "1.9.22" apply false/g' android/settings.gradle || true
            fi
          else
            echo "Failed to create android folder."
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release > build_log.txt 2>&1
        continue-on-error: true

      - name: Show Build Log
        run: cat build_log.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voltride-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
